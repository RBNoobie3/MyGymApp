<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LogPress: Exercises & Programs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        },
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        body.modal-open { overflow: hidden; }

        /* Loader animation */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Tab transitions */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <header class="sticky top-0 bg-gray-900 border-b border-gray-800 z-30 shadow-md">
        <div class="p-4 max-w-4xl mx-auto space-y-4">
            <!-- Title -->
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                MY GYM APP REPOSITORY
            </h1> <br>
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Exercise Library
            </h1>
            
            <!-- Tabs -->
            <div class="flex bg-gray-950 p-1 rounded-lg border border-gray-800">
                <button onclick="app.switchTab('exercises')" id="tabBtn-exercises" class="flex-1 py-2 text-sm font-medium rounded-md bg-gray-800 text-white shadow-sm transition-all duration-200">
                    EXERCISES
                </button>
                <button onclick="app.switchTab('programs')" id="tabBtn-programs" class="flex-1 py-2 text-sm font-medium rounded-md text-gray-400 hover:text-gray-200 transition-all duration-200">
                    PROGRAMS
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 max-w-4xl mx-auto w-full relative">
        
        <!-- Global Loading State -->
        <div id="loadingState" class="absolute inset-0 flex flex-col items-center justify-center pt-20 z-20 bg-gray-950">
            <div class="spinner mb-4"></div>
            <p class="text-gray-400 font-medium">Loading fitness database...</p>
        </div>

        <!-- Global Error State -->
        <div id="errorState" class="hidden text-center pt-20">
            <svg class="w-16 h-16 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h2 class="text-xl font-bold text-white mb-2">Failed to load data</h2>
            <p class="text-gray-400 mb-4" id="errorMessage">Please check your connection.</p>
            <button onclick="app.init()" class="bg-brand-600 hover:bg-brand-500 px-6 py-2 rounded-lg font-medium">Try Again</button>
        </div>

        <!-- ==================== EXERCISES TAB ==================== -->
        <div id="tab-exercises" class="tab-content active space-y-4">
            <!-- Search & Filters -->
            <div class="space-y-3">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Search exercises..." class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-colors">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="targetFilter" class="bg-gray-800 text-sm text-gray-200 border border-gray-700 rounded-lg p-2.5 focus:outline-none focus:border-brand-500">
                        <option value="">All Muscles</option>
                    </select>
                    <select id="equipmentFilter" class="bg-gray-800 text-sm text-gray-200 border border-gray-700 rounded-lg p-2.5 focus:outline-none focus:border-brand-500">
                        <option value="">All Equipment</option>
                    </select>
                </div>
            </div>

            <!-- Exercise Grid -->
            <div id="exerciseGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mt-6"></div>
            
            <div id="emptyState" class="hidden text-center py-12 text-gray-400">No exercises found.</div>
            
            <button id="loadMoreBtn" class="hidden bg-gray-800 hover:bg-gray-700 text-white border border-gray-700 px-8 py-3 rounded-xl font-medium w-full shadow-sm mt-4">
                Load More
            </button>
        </div>

        <!-- ==================== PROGRAMS TAB ==================== -->
        <div id="tab-programs" class="tab-content relative">
            
            <!-- Environment Filter for Programs -->
            <div class="mb-6 bg-gray-900 border border-gray-800 p-3 rounded-lg flex items-center justify-between shadow-sm">
                <span class="text-sm font-medium text-gray-300 flex items-center gap-2">
                    <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Environment:
                </span>
                <select id="programEnvFilter" class="bg-gray-800 text-sm text-brand-400 border border-gray-700 rounded-md p-2 focus:outline-none focus:border-brand-500 font-semibold transition-colors" onchange="app.programs.onEnvChange()">
                    <option value="gym">Gym Workout (Machine, Barbell, DB)</option>
                    <option value="home">Home Workout (Body, Band, DB)</option>
                </select>
            </div>

            <!-- View 1: Splits List -->
            <div id="programs-splits-view" class="space-y-4">
                <h2 class="text-xl font-bold mb-4">Choose a Workout Split</h2>
                <div id="splitsContainer" class="grid gap-4">
                    <!-- Populated via JS -->
                </div>
            </div>

            <!-- View 2: Days List -->
            <div id="programs-days-view" class="hidden space-y-4">
                <button onclick="app.programs.showSplitsView()" class="text-brand-400 flex items-center gap-1 text-sm font-medium mb-2 hover:text-brand-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Back to Splits
                </button>
                <h2 id="selectedSplitTitle" class="text-2xl font-bold"></h2>
                <p id="selectedSplitDesc" class="text-gray-400 text-sm mb-6"></p>
                <div id="daysContainer" class="grid gap-3">
                    <!-- Populated via JS -->
                </div>
            </div>

            <!-- View 3: Day Exercises -->
            <div id="programs-exercises-view" class="hidden space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <button onclick="app.programs.showDaysView()" class="text-brand-400 flex items-center gap-1 text-sm font-medium hover:text-brand-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        Back to Days
                    </button>
                    <button onclick="app.programs.generateRoutine()" class="bg-brand-600 hover:bg-brand-500 text-white text-xs px-3 py-1.5 rounded flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Generate Routine
                    </button>
                </div>
                <h2 id="selectedDayTitle" class="text-2xl font-bold text-brand-400"></h2>
                <p class="text-sm text-gray-400">Targeting: <span id="selectedDayTargets" class="capitalize"></span></p>
                <div id="programExerciseGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mt-6">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Exercise Detail Modal -->
    <div id="exerciseModal" class="fixed inset-0 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="app.closeModal()"></div>
        
        <div class="absolute inset-x-0 bottom-0 top-12 sm:top-20 md:top-auto md:bottom-auto md:inset-0 md:flex md:items-center md:justify-center transition-transform duration-300 translate-y-full md:translate-y-0" id="modalContentContainer">
            <div class="bg-gray-900 w-full h-full md:h-auto md:max-h-[90vh] md:max-w-2xl md:rounded-2xl flex flex-col shadow-2xl overflow-hidden border-t md:border border-gray-700">
                
                <div class="flex justify-between items-center p-4 border-b border-gray-800 bg-gray-900 sticky top-0 z-10">
                    <h2 id="modalTitle" class="text-lg font-bold text-white capitalize truncate pr-4"></h2>
                    <button onclick="app.closeModal()" class="text-gray-400 hover:text-white p-2 bg-gray-800 rounded-full">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto p-4 space-y-6">
                    <div class="bg-gray-950 rounded-xl flex items-center justify-center overflow-hidden min-h-[250px] relative border border-gray-800">
                        <div id="modalImageLoader" class="absolute inset-0 flex items-center justify-center"><div class="spinner"></div></div>
                        <img id="modalMedia" src="" class="w-full h-auto max-h-[400px] object-contain hidden" 
                             onload="document.getElementById('modalImageLoader').style.display='none'; this.classList.remove('hidden');" 
                             onerror="this.onerror=null; this.src='https://placehold.co/400x300/111827/4b5563?text=Media+Unavailable'; document.getElementById('modalImageLoader').style.display='none'; this.classList.remove('hidden');">
                    </div>

                    <div class="flex flex-wrap gap-2 text-sm font-medium">
                        <span id="modalTarget" class="bg-brand-500/10 text-brand-400 px-3 py-1 rounded-full border border-brand-500/20 capitalize"></span>
                        <span id="modalEquipment" class="bg-purple-500/10 text-purple-400 px-3 py-1 rounded-full border border-purple-500/20 capitalize"></span>
                    </div>

                    <div>
                        <h3 class="text-sm text-gray-400 uppercase tracking-wider font-semibold mb-3">Instructions</h3>
                        <ol id="modalInstructions" class="list-decimal list-outside ml-4 space-y-3 text-gray-300 text-sm leading-relaxed"></ol>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const app = {
            // Config
            DATA_URL: 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json',
            BASE_REPO_URL: 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/',
            CACHE_KEY: 'logpress_cache_v2',
            ITEMS_PER_PAGE: 50,
            
            // Core State
            allData: [],
            filteredData: [],
            currentPage: 1,
            currentTab: 'exercises',
            
            // DOM
            els: {
                loading: document.getElementById('loadingState'),
                error: document.getElementById('errorState'),
                errorMsg: document.getElementById('errorMessage'),
                
                // Tabs
                tabExercises: document.getElementById('tab-exercises'),
                tabPrograms: document.getElementById('tab-programs'),
                btnExercises: document.getElementById('tabBtn-exercises'),
                btnPrograms: document.getElementById('tabBtn-programs'),
                
                // Exercise Tab
                grid: document.getElementById('exerciseGrid'),
                empty: document.getElementById('emptyState'),
                loadMore: document.getElementById('loadMoreBtn'),
                search: document.getElementById('searchInput'),
                targetFilter: document.getElementById('targetFilter'),
                equipFilter: document.getElementById('equipmentFilter'),
                
                // Modal
                modal: document.getElementById('exerciseModal'),
                modalContainer: document.getElementById('modalContentContainer'),
                modalTitle: document.getElementById('modalTitle'),
                modalMedia: document.getElementById('modalMedia'),
                modalTarget: document.getElementById('modalTarget'),
                modalEquipment: document.getElementById('modalEquipment'),
                modalInstructions: document.getElementById('modalInstructions'),
                modalLoader: document.getElementById('modalImageLoader')
            },

            // Programs Module Configuration
            programs: {
                currentSplit: null,
                currentDay: null,
                environment: 'gym',
                splits: [
                    {
                        id: '3day_ppl',
                        name: '3-Day PPL',
                        desc: 'Classic Push, Pull, Legs routine.',
                        days: [
                            { name: 'Day 1: Push', targets: ['pectorals', 'delts', 'triceps', 'serratus anterior'] },
                            { name: 'Day 2: Pull', targets: ['lats', 'upper back', 'traps', 'biceps', 'forearms'] },
                            { name: 'Day 3: Legs/Core', targets: ['quads', 'hamstrings', 'glutes', 'calves', 'abductors', 'adductors', 'abs'] }
                        ]
                    },
                    {
                        id: '4day_ul',
                        name: '4-Day Upper/Lower',
                        desc: 'Hits upper and lower body twice a week.',
                        days: [
                            { name: 'Upper A', targets: ['pectorals', 'delts', 'lats', 'upper back', 'triceps', 'biceps'] },
                            { name: 'Lower A', targets: ['quads', 'hamstrings', 'glutes', 'calves', 'abs'] },
                            { name: 'Upper B', targets: ['pectorals', 'delts', 'lats', 'upper back', 'triceps', 'biceps'] },
                            { name: 'Lower B', targets: ['quads', 'hamstrings', 'glutes', 'calves', 'abs'] }
                        ]
                    },
                    {
                        id: '5day_bro',
                        name: '5-Day Body Part Split',
                        desc: 'High focus single-muscle days.',
                        days: [
                            { name: 'Chest Day', targets: ['pectorals', 'serratus anterior'] },
                            { name: 'Back Day', targets: ['lats', 'upper back', 'traps'] },
                            { name: 'Shoulder Day', targets: ['delts'] },
                            { name: 'Leg Day', targets: ['quads', 'hamstrings', 'glutes', 'calves'] },
                            { name: 'Arm Day', targets: ['biceps', 'triceps', 'forearms'] }
                        ]
                    }
                ],
                // Programs methods will be defined below
            },

            async init() {
                try {
                    await this.loadData();
                    this.populateFilters();
                    this.setupListeners();
                    this.applyFilters();
                    this.programs.initUI();
                    this.els.loading.classList.add('hidden');
                } catch (err) {
                    this.els.loading.classList.add('hidden');
                    this.els.error.classList.remove('hidden');
                    this.els.errorMsg.textContent = err.message;
                }
            },

            async loadData() {
                if (navigator.onLine) {
                    try {
                        const res = await fetch(this.DATA_URL);
                        if (!res.ok) throw new Error('Network error');
                        const data = await res.json();
                        this.allData = data;
                        
                        // Minify for local storage limit (5MB)
                        try {
                            const minified = this.allData.map(ex => ({
                                id: ex.id,
                                name: ex.name,
                                target: ex.target,
                                equipment: ex.equipment,
                                category: ex.category,
                                instructions: Array.isArray(ex.instructions) ? ex.instructions : (ex.instructions?.en || []),
                                image: ex.image, video: ex.video, gif_url: ex.gif_url
                            }));
                            localStorage.setItem(this.CACHE_KEY, JSON.stringify(minified));
                        } catch (e) { console.warn("Cache save failed", e); }
                        return;
                    } catch (e) {
                        console.warn("Fetch failed, trying cache");
                    }
                }
                const cached = localStorage.getItem(this.CACHE_KEY);
                if (cached) {
                    this.allData = JSON.parse(cached);
                } else {
                    throw new Error("No internet and no cached data.");
                }
            },

            setupListeners() {
                [this.els.search, this.els.targetFilter, this.els.equipFilter].forEach(el => {
                    el.addEventListener('input', () => {
                        this.currentPage = 1;
                        this.els.grid.innerHTML = '';
                        this.applyFilters();
                    });
                });

                this.els.loadMore.addEventListener('click', () => {
                    this.currentPage++;
                    this.renderGrid();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !this.els.modal.classList.contains('hidden')) {
                        this.closeModal();
                    }
                });
            },

            switchTab(tabId) {
                this.currentTab = tabId;
                
                // Toggle Button Styling
                const activeClasses = ['bg-gray-800', 'text-white', 'shadow-sm'];
                const inactiveClasses = ['text-gray-400', 'hover:text-gray-200', 'bg-transparent'];

                if (tabId === 'exercises') {
                    this.els.btnExercises.classList.add(...activeClasses);
                    this.els.btnExercises.classList.remove(...inactiveClasses);
                    this.els.btnPrograms.classList.remove(...activeClasses);
                    this.els.btnPrograms.classList.add(...inactiveClasses);
                    
                    this.els.tabExercises.classList.add('active');
                    this.els.tabPrograms.classList.remove('active');
                } else {
                    this.els.btnPrograms.classList.add(...activeClasses);
                    this.els.btnPrograms.classList.remove(...inactiveClasses);
                    this.els.btnExercises.classList.remove(...activeClasses);
                    this.els.btnExercises.classList.add(...inactiveClasses);
                    
                    this.els.tabPrograms.classList.add('active');
                    this.els.tabExercises.classList.remove('active');
                }
            },

            populateFilters() {
                const targets = new Set();
                const equips = new Set();
                this.allData.forEach(ex => {
                    if (ex.target) targets.add(ex.target.toLowerCase());
                    if (ex.equipment) equips.add(ex.equipment.toLowerCase());
                });

                const appendOptions = (select, set) => {
                    Array.from(set).sort().forEach(item => {
                        select.insertAdjacentHTML('beforeend', `<option value="${item}">${item}</option>`);
                    });
                };
                appendOptions(this.els.targetFilter, targets);
                appendOptions(this.els.equipFilter, equips);
            },

            applyFilters() {
                const q = this.els.search.value.toLowerCase().trim();
                const t = this.els.targetFilter.value;
                const e = this.els.equipFilter.value;

                this.filteredData = this.allData.filter(ex => {
                    return (!q || ex.name.toLowerCase().includes(q)) &&
                           (!t || (ex.target && ex.target.toLowerCase() === t)) &&
                           (!e || (ex.equipment && ex.equipment.toLowerCase() === e));
                });
                this.renderGrid();
            },

            renderGrid() {
                const start = (this.currentPage - 1) * this.ITEMS_PER_PAGE;
                const end = start + this.ITEMS_PER_PAGE;
                const pageData = this.filteredData.slice(start, end);

                if (this.filteredData.length === 0) {
                    this.els.empty.classList.remove('hidden');
                    this.els.loadMore.classList.add('hidden');
                } else {
                    this.els.empty.classList.add('hidden');
                    const fragment = document.createDocumentFragment();
                    pageData.forEach(ex => fragment.appendChild(this.createCard(ex)));
                    this.els.grid.appendChild(fragment);

                    if (end < this.filteredData.length) this.els.loadMore.classList.remove('hidden');
                    else this.els.loadMore.classList.add('hidden');
                }
            },

            createCard(ex) {
                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-800 rounded-xl overflow-hidden cursor-pointer hover:border-gray-600 transition-colors shadow-sm active:scale-[0.98] transform group flex flex-col";
                card.onclick = () => this.openModal(ex.id);

                const imgPath = ex.image || `images/${ex.id}.jpg`;
                const imgSrc = imgPath.startsWith('http') ? imgPath : `${this.BASE_REPO_URL}${imgPath}`;

                card.innerHTML = `
                    <div class="h-44 bg-gray-950 relative overflow-hidden flex items-center justify-center p-3">
                        <img src="${imgSrc}" loading="lazy" alt="${ex.name}" class="max-h-full max-w-full object-contain mix-blend-screen group-hover:scale-105 transition-transform duration-300" onerror="this.onerror=null; this.src='https://placehold.co/300x200/111827/4b5563?text=No+Image';">
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-bold text-white text-sm capitalize mb-1 truncate">${ex.name}</h3>
                        <div class="flex items-center gap-1 text-xs font-medium">
                            <span class="text-brand-400 capitalize truncate">${ex.target || 'Unknown'}</span>
                            <span class="text-gray-600">•</span>
                            <span class="text-gray-400 capitalize truncate">${ex.equipment || 'Body'}</span>
                        </div>
                    </div>
                `;
                return card;
            },

            openModal(id) {
                const ex = this.allData.find(e => e.id === id);
                if (!ex) return;

                this.els.modalTitle.textContent = ex.name;
                this.els.modalTarget.textContent = ex.target || 'N/A';
                this.els.modalEquipment.textContent = ex.equipment || 'N/A';

                // Instructions
                let inst = ex.instructions || [];
                if (typeof inst === 'object' && !Array.isArray(inst)) inst = inst.en || [];
                if (typeof inst === 'string') inst = inst.split('\n').filter(s=>s.trim());
                
                if (inst.length) {
                    this.els.modalInstructions.innerHTML = inst.map(step => `<li class="pl-2">${step}</li>`).join('');
                } else {
                    this.els.modalInstructions.innerHTML = `<li>No instructions available.</li>`;
                }

                // Media
                this.els.modalMedia.classList.add('hidden');
                this.els.modalLoader.style.display = 'flex';
                const vidPath = ex.gif_url || ex.video || `videos/${ex.id}.gif`;
                this.els.modalMedia.src = vidPath.startsWith('http') ? vidPath : `${this.BASE_REPO_URL}${vidPath}`;

                // Show
                this.els.modal.classList.remove('hidden');
                document.body.classList.add('modal-open');
                void this.els.modal.offsetWidth; // force reflow
                this.els.modal.classList.remove('opacity-0');
                if (window.innerWidth < 768) this.els.modalContainer.classList.remove('translate-y-full');
            },

            closeModal() {
                this.els.modal.classList.add('opacity-0');
                if (window.innerWidth < 768) this.els.modalContainer.classList.add('translate-y-full');
                setTimeout(() => {
                    this.els.modal.classList.add('hidden');
                    document.body.classList.remove('modal-open');
                    this.els.modalMedia.src = ''; 
                }, 300);
            }
        };

        app.programs.initUI = function() {
            const container = document.getElementById('splitsContainer');
            container.innerHTML = this.splits.map(split => `
                <div onclick="app.programs.selectSplit('${split.id}')" class="bg-gray-900 border border-gray-800 rounded-xl p-5 cursor-pointer hover:border-brand-500 transition-colors group relative overflow-hidden">
                    <div class="absolute right-0 top-0 h-full w-2 bg-brand-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <h3 class="text-lg font-bold text-white mb-1 group-hover:text-brand-400 transition-colors">${split.name}</h3>
                    <p class="text-sm text-gray-400">${split.desc}</p>
                    <div class="mt-4 flex gap-2 flex-wrap">
                        ${split.days.map(d => `<span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-300">${d.name}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        };

        app.programs.selectSplit = function(splitId) {
            this.currentSplit = this.splits.find(s => s.id === splitId);
            
            document.getElementById('selectedSplitTitle').textContent = this.currentSplit.name;
            document.getElementById('selectedSplitDesc').textContent = this.currentSplit.desc;
            
            const daysContainer = document.getElementById('daysContainer');
            daysContainer.innerHTML = this.currentSplit.days.map((day, idx) => `
                <div onclick="app.programs.selectDay(${idx})" class="bg-gray-900 border border-gray-800 rounded-lg p-4 cursor-pointer hover:border-gray-600 flex justify-between items-center transition-colors">
                    <div>
                        <h4 class="font-bold text-white">${day.name}</h4>
                        <p class="text-xs text-gray-400 mt-1 capitalize">${day.targets.join(', ')}</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
            `).join('');

            this.showDaysView();
        };

        app.programs.selectDay = function(dayIndex) {
            this.currentDay = this.currentSplit.days[dayIndex];
            
            document.getElementById('selectedDayTitle').textContent = this.currentDay.name;
            document.getElementById('selectedDayTargets').textContent = this.currentDay.targets.join(', ');
            
            this.renderDayExercises(false);
            this.showExercisesView();
        };

        app.programs.onEnvChange = function() {
            this.environment = document.getElementById('programEnvFilter').value;
            // If we are currently viewing exercises, immediately re-render them with the new filter
            if (!document.getElementById('programs-exercises-view').classList.contains('hidden')) {
                this.renderDayExercises(false); 
            }
        };

        app.programs.renderDayExercises = function(randomize = false) {
            const grid = document.getElementById('programExerciseGrid');
            grid.innerHTML = '';
            
            // Filter global dataset by the day's target muscles
            const targets = this.currentDay.targets.map(t => t.toLowerCase());
            let dayExercises = app.allData.filter(ex => {
                if (!ex.target) return false;
                return targets.includes(ex.target.toLowerCase());
            });

            // Apply Environment Filter (Gym vs Home)
            if (this.environment === 'home') {
                const homeEquipment = ['body weight', 'band', 'dumbbell'];
                dayExercises = dayExercises.filter(ex => {
                    if (!ex.equipment) return true; // Assume bodyweight if missing
                    const eq = ex.equipment.toLowerCase();
                    return homeEquipment.some(hEq => eq.includes(hEq));
                });
            } else if (this.environment === 'gym') {
                const gymEquipment = ['machine', 'dumbbell', 'barbell', 'cable', 'smith']; 
                dayExercises = dayExercises.filter(ex => {
                    if (!ex.equipment) return false; // Exclude bodyweight/missing for strictly gym
                    const eq = ex.equipment.toLowerCase();
                    return gymEquipment.some(gEq => eq.includes(gEq));
                });
            }

            if (randomize) {
                // Shuffle array
                for (let i = dayExercises.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [dayExercises[i], dayExercises[j]] = [dayExercises[j], dayExercises[i]];
                }
                // Pick exactly 6 exercises for a routine
                dayExercises = dayExercises.slice(0, 6);
            }

            if (dayExercises.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-8 text-gray-500">No matching exercises found.</p>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            dayExercises.forEach(ex => fragment.appendChild(app.createCard(ex)));
            grid.appendChild(fragment);
        };

        app.programs.generateRoutine = function() {
            // Adds a small rotation animation to button for feedback
            const btnIcon = event.currentTarget.querySelector('svg');
            btnIcon.classList.add('animate-spin');
            setTimeout(() => btnIcon.classList.remove('animate-spin'), 500);
            
            this.renderDayExercises(true);
        };

        // View management for Programs tab
        app.programs.showSplitsView = function() {
            document.getElementById('programs-splits-view').classList.remove('hidden');
            document.getElementById('programs-days-view').classList.add('hidden');
            document.getElementById('programs-exercises-view').classList.add('hidden');
        };
        app.programs.showDaysView = function() {
            document.getElementById('programs-splits-view').classList.add('hidden');
            document.getElementById('programs-days-view').classList.remove('hidden');
            document.getElementById('programs-exercises-view').classList.add('hidden');
        };
        app.programs.showExercisesView = function() {
            document.getElementById('programs-splits-view').classList.add('hidden');
            document.getElementById('programs-days-view').classList.add('hidden');
            document.getElementById('programs-exercises-view').classList.remove('hidden');
        };

        // Boot
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
